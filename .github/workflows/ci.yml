name: CI

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Build (strict)
        run: |
          for dir in AVLTree BPlusTree Deque DoubleLinkedList DynamicArray HashTable PriorityQueue Queue RedBlackTree SinglyLinkedList SkipList Stack String test_project Algorithms/HuffmanCoding; do
            echo "=== $dir (library) ==="
            for src in $dir/ds_*.c; do
              [ -f "$src" ] || continue
              ${{ matrix.compiler }} -std=c99 -Wall -Wextra -Werror -c "$src" -o /dev/null || exit 1
            done
          done

      - name: Link (relaxed, includes main.c)
        run: |
          for dir in AVLTree BPlusTree Deque DoubleLinkedList DynamicArray HashTable PriorityQueue Queue RedBlackTree SinglyLinkedList Stack String test_project Algorithms/HuffmanCoding; do
            echo "=== $dir (full) ==="
            ${{ matrix.compiler }} -std=c99 -Wall -Wextra $dir/*.c -o /dev/null || exit 1
          done

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build (MSVC)
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          for dir in AVLTree BPlusTree Deque DoubleLinkedList DynamicArray HashTable PriorityQueue Queue RedBlackTree SinglyLinkedList Stack String test_project Algorithms/HuffmanCoding; do
            echo "=== $dir ==="
            cl /nologo /std:c11 /W3 /WX /Fe:$dir/test.exe $dir/*.c || exit 1
            rm -f $dir/test.exe $dir/*.obj
          done
